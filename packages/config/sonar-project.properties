# SonarQube Project Configuration
sonar.projectKey=headless-multitenant-platform
sonar.projectName=Headless Multi-Tenant E-Commerce Platform
sonar.projectVersion=1.0.0

sonar.sources=apps,packages
sonar.exclusions=**/node_modules/**,**/.next/**,**/.medusa/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
