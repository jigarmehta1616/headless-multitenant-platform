services:
  # 1. PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa_password}
      POSTGRES_DB: ${POSTGRES_DB:-medusa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa_user} -d ${POSTGRES_DB:-medusa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7
  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Medusa Server (API & Admin)
  medusa-server:
    build:
      context: .
      dockerfile: apps/medusa/Dockerfile
    container_name: medusa-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MEDUSA_WORKER_MODE: server
      PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa_user}:${POSTGRES_PASSWORD:-medusa_password}@postgres:5432/${POSTGRES_DB:-medusa_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_for_local_testing_min_32_chars}
      COOKIE_SECRET: ${COOKIE_SECRET:-super_secret_cookie_for_local_testing_min_32}
      STORE_CORS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      ADMIN_CORS: http://localhost:9000,http://localhost:5173
      AUTH_CORS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:9000
      OUTBOUND_WEBHOOK_URL: http://mock-webhook-receiver:5678/webhook/medusa
      OUTBOUND_WEBHOOK_SECRET: ${OUTBOUND_WEBHOOK_SECRET:-whsec_test_secret_for_local_mock_receiver}
    ports:
      - "9000:9000"

  # 4. Medusa Worker (Workflows, Scheduled Jobs, Event Processing)
  medusa-worker:
    build:
      context: .
      dockerfile: apps/medusa/Dockerfile
    container_name: medusa-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MEDUSA_WORKER_MODE: worker
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa_user}:${POSTGRES_PASSWORD:-medusa_password}@postgres:5432/${POSTGRES_DB:-medusa_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_for_local_testing_min_32_chars}
      COOKIE_SECRET: ${COOKIE_SECRET:-super_secret_cookie_for_local_testing_min_32}
      OUTBOUND_WEBHOOK_URL: http://mock-webhook-receiver:5678/webhook/medusa
      OUTBOUND_WEBHOOK_SECRET: ${OUTBOUND_WEBHOOK_SECRET:-whsec_test_secret_for_local_mock_receiver}

volumes:
  postgres_data:
  redis_data:
